name: JAVIS CI/CD - Build & Release Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Custom release notes for manual workflow trigger'
        required: false
        default: 'Manual build triggered via workflow_dispatch'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-lint:
    name: 🧪 Run Unit Tests (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle and Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  build-and-package:
    name: 📦 Build APK & Release (CD)
    needs: [test-and-lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle and Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: |
          ./gradlew assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PversionName="1.0.${{ github.run_number }}" \
            --no-daemon --stacktrace

      - name: Rename APK artifact with version tag
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/javis-v1.0.${{ github.run_number }}-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: javis-debug-apk-build-${{ github.run_number }}
          path: artifacts/javis-v1.0.${{ github.run_number }}-debug.apk
          retention-days: 14

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          tag_name: build-${{ github.run_number }}
          name: "JAVIS v1.0.${{ github.run_number }} (Build #${{ github.run_number }})"
          draft: false
          prerelease: false
          body: |
            ## 🚀 JAVIS Android - Official Release Build
            
            - **Build Code (versionCode):** `${{ github.run_number }}`
            - **Version Name (versionName):** `1.0.${{ github.run_number }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **Branch:** `${{ github.ref_name }}`
            - **Release Notes:** ${{ github.event.inputs.release_notes || 'Automated release build triggered upon merge to main branch.' }}
            
            ---
            ### 📥 Download & Installation:
            - Download the attached `javis-v1.0.${{ github.run_number }}-debug.apk` asset below and install it directly on your Android device.
          token: ${{ secrets.GITHUB_TOKEN }}
          files: artifacts/javis-v1.0.${{ github.run_number }}-debug.apk
